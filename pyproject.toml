[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "seamtranslation"
version = "0.1.0"
description = "Compact speech-to-speech translation for low-power ARM devices"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = ["pyarrow>=20,<24", "pytest>=8.3,<9", "ruff>=0.9,<1"]
ml = ["numpy>=2,<3", "torch>=2.6,<3", "torchaudio>=2.6,<3"]
data = ["pyarrow>=20,<24"]

[project.scripts]
seamtranslation = "seamtranslation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
